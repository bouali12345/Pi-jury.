<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pi Jury Ultimate</title>
    <script src="https://sdk.minepi.com/pi-sdk.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: white; transition: all 0.3s ease; }
        .pi-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); }
        .gradient-btn { background: linear-gradient(90deg, #9333ea, #4f46e5); }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col text-right">

    <div class="flex justify-between items-center mb-6" id="header">
        <button onclick="toggleLanguage()" class="bg-gray-700 px-4 py-2 rounded-lg text-sm font-bold border border-purple-500">
            🌐 <span id="lang-btn-text">English</span>
        </button>
        <h1 id="app-title" class="text-xl font-bold text-purple-400 text-left">⚖️ Pi Jury Ultimate</h1>
    </div>

    <div class="pi-card rounded-2xl p-6 mb-6 text-center shadow-xl">
        <p id="welcome-msg" class="text-gray-400 mb-2 italic text-center">مرحباً بك في المحكمة اللامركزية</p>
        <div class="bg-purple-900/30 py-2 px-4 rounded-full inline-block mb-2 text-center">
            <h2 id="user-name" class="text-xl font-bold text-green-400">@Guest</h2>
        </div>
        <p id="user-uid" class="text-[10px] text-gray-500 break-all mt-2 opacity-50">UID: --</p>
    </div>

    <div class="grid grid-cols-2 gap-4 mb-8">
        <div class="pi-card rounded-2xl p-4 text-center border-b-4 border-purple-600">
            <span id="stat-votes-val" class="block text-3xl font-bold text-white text-center">0</span>
            <span id="stat-votes-lbl" class="text-xs uppercase tracking-wider text-purple-300">أصواتك</span>
        </div>
        <div class="pi-card rounded-2xl p-4 text-center border-b-4 border-indigo-600">
            <span id="stat-cases-val" class="block text-3xl font-bold text-white text-center">0</span>
            <span id="stat-cases-lbl" class="text-xs uppercase tracking-wider text-indigo-300 text-center">قضاياك</span>
        </div>
    </div>

    <div class="mt-auto mb-10">
        <button onclick="createNewCase()" class="gradient-btn w-full p-5 rounded-2xl font-bold text-lg shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2">
            <span id="btn-new-case">➕ إضافة قضية جديدة</span>
        </button>
        <p id="footer-note" class="text-center text-[10px] text-gray-500 mt-4">Powered by Pi Network SDK v.2.0</p>
    </div>

    <script>
        const Pi = window.Pi;
        let currentLang = 'ar';

        const translations = {
            ar: {
                title: "⚖️ Pi Jury Ultimate",
                welcome: "مرحباً بك في المحكمة اللامركزية",
                votes_lbl: "أصواتك",
                cases_lbl: "قضاياك",
                new_case: "➕ إضافة قضية جديدة",
                lang_btn: "English",
                payment_msg: "سيطلب منك التطبيق دفع 0.1 Pi لنشر القضية قريباً."
            },
            en: {
                title: "⚖️ Pi Jury Ultimate",
                welcome: "Welcome to Decentralized Court",
                votes_lbl: "Your Votes",
                cases_lbl: "Your Cases",
                new_case: "➕ Create New Case",
                lang_btn: "العربية",
                payment_msg: "The app will require 0.1 Pi to publish a case soon."
            }
        };

        function toggleLanguage() {
            currentLang = currentLang === 'ar' ? 'en' : 'ar';
            document.documentElement.lang = currentLang;
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            const body = document.body;
            body.className = currentLang === 'ar' ? "min-h-screen p-4 flex flex-col text-right" : "min-h-screen p-4 flex flex-col text-left";
            updateUI();
        }

        function updateUI() {
            const t = translations[currentLang];
            document.getElementById('app-title').innerText = t.title;
            document.getElementById('welcome-msg').innerText = t.welcome;
            document.getElementById('stat-votes-lbl').innerText = t.votes_lbl;
            document.getElementById('stat-cases-lbl').innerText = t.cases_lbl;
            document.getElementById('btn-new-case').innerText = t.new_case;
            document.getElementById('lang-btn-text').innerText = t.lang_btn;
        }

        async function initPi() {
            try {
                await Pi.init({ version: "2.0", sandbox: true });
                const auth = await Pi.authenticate(['username', 'payments']);
                document.getElementById('user-name').innerText = "@" + auth.user.username;
                document.getElementById('user-uid').innerText = "UID: " + auth.user.uid;
            } catch (err) { console.error(err); }
        }
        initPi();
        function createNewCase() { alert(translations[currentLang].payment_msg); }
    </script>
</body>
</html>
